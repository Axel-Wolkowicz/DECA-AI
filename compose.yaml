# Despliegue del servicio de inferencia en un servidor propio. Ver DESPLIEGUE.md.
#
#   docker compose up -d                   -> solo el servicio, en 127.0.0.1:8000
#                                             (variante A: lo publica el proxy de sistemas)
#   docker compose --profile tunel up -d   -> servicio + tunel de Cloudflare
#                                             (variante B: URL publica sin abrir puertos)
#
# Los secretos van en un archivo .env al lado de este (no se versiona), ver .env.ejemplo.

services:
  inferencia:
    build: .
    image: deca-inferencia:1.0
    environment:
      # Sin token no arranca el compose: que falte tiene que ser un error visible, no un
      # servicio que responde 500 a todo.
      DECA_API_TOKEN: ${DECA_API_TOKEN:?Falta DECA_API_TOKEN en .env}
    # Solo loopback: aunque el firewall del servidor este abierto, el servicio no se ve
    # desde la red. Lo alcanzan el proxy (que corre en el mismo host) o el tunel (por la
    # red interna de compose).
    ports:
      - "127.0.0.1:${DECA_PUERTO:-8000}:8000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  tunel:
    profiles: ["tunel"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Falta CLOUDFLARE_TUNNEL_TOKEN en .env}
    depends_on:
      inferencia:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
