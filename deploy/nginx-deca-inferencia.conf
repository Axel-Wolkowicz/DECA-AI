# Ejemplo para sistemas (variante A): publica el servicio, que escucha en 127.0.0.1:8000,
# bajo un dominio con HTTPS. Ajustar server_name y las rutas del certificado.

server {
    listen 443 ssl;
    server_name inferencia-deca.ejemplo.edu.ar;

    ssl_certificate     /etc/ssl/certs/inferencia-deca.crt;
    ssl_certificate_key /etc/ssl/private/inferencia-deca.key;

    # El servicio acepta archivos de hasta 32 MB (MAX_BYTES en src/servidor.py). El default
    # de nginx es 1 MB y cortaria ECG legitimos con un 413 antes de llegar al servicio.
    client_max_body_size 33m;

    # El backend corta a los 30 s; un analisis tarda menos de 1 s en CPU.
    proxy_read_timeout 60s;

    # El cuerpo de los pedidos es un ECG (dato de salud): no se loguea. El access log normal
    # (ruta, codigo, tiempo) no lo incluye y puede quedar.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name inferencia-deca.ejemplo.edu.ar;
    return 301 https://$host$request_uri;
}
